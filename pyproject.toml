[project]
name = "onchain-risk-ml"
version = "0.1.0"
description = "Chronological Bitcoin transaction risk evaluation and serving"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "scikit-learn>=1.5,<2", "numpy>=1.26,<3", "joblib>=1.4,<2", "threadpoolctl>=3,<4"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
